# SPDX-License-Identifier: Apache-2.0
[project]
name = "flexo-rtm"
version = "0.0.1"
description = "Verifiable self-certification oracle for bidirectional requirements traceability of SysMLv2 models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Michael Zargham" }]
dependencies = [
    "rdflib>=7.0",
    "pyshacl>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
signing = ["cryptography>=42"]
analysis = ["owlrl>=6.0.2"]
viz = ["matplotlib", "networkx", "graphviz"]

[project.scripts]
flexo-rtm = "oracle.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oracle/src/oracle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: integration test requiring live external service (auto-skipped without credentials)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["oracle/src", "ontology/parsimony/build.py"]
